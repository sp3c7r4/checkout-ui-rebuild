server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # AWS Marketplace posts the fulfillment form to the site root. A rewrite (not a
  # proxy_pass in limit_except) keeps the method and body, then the /api/ proxy
  # below forwards it to the backend. GET / still serves the SPA.
  location = / {
    if ($request_method = POST) {
      rewrite ^ /api/v1/marketplace/fulfillment last;
    }
    try_files /index.html =404;
  }

  # `api` is the compose service name for the backend
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA routes (/dashboard/*, /auth) all fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
