server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # AWS Marketplace posts the fulfillment form to the site root; GET keeps the SPA.
  # `api` is the compose service name for the backend.
  location = / {
    limit_except GET {
      proxy_pass http://api:3000/api/v1/marketplace/fulfillment;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    try_files /index.html =404;
  }

  # SPA routes (/dashboard/*, /auth) all fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
